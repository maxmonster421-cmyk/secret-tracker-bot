services:
  - type: web
    name: secret-tracker-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: API_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
